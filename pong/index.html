<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D YELLOW RED CREATED BY VARADA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0d0905;
            color: #ffffff;
            font-family: 'Noto Sans Georgian', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud-top {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 24px;
            background: rgba(30, 20, 10, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 204, 0, 0.3);
            padding: 10px 28px;
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.2), inset 0 0 12px rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
        }

        .score-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 2px;
        }

        .player-label { color: #ffcc00; }
        .ai-label { color: #ff3333; }

        .score-value {
            font-family: 'Orbitron', 'Noto Sans Georgian', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
        }

        #player-score {
            color: #ffcc00;
            text-shadow: 0 0 14px rgba(255, 204, 0, 0.8);
        }

        #ai-score {
            color: #ff3333;
            text-shadow: 0 0 14px rgba(255, 51, 51, 0.8);
        }

        .divider {
            width: 2px;
            height: 36px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        #controls-bar {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            gap: 14px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(24, 14, 8, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .game-btn {
            cursor: pointer;
            font-family: 'Noto Sans Georgian', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            background: linear-gradient(135deg, #442816 0%, #29150d 100%);
            border: 1px solid rgba(255, 204, 0, 0.45);
            border-radius: 999px;
            padding: 10px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        .game-btn:hover {
            transform: translateY(-2px);
            border-color: #ffcc00;
            box-shadow: 0 6px 20px rgba(255, 204, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.35);
            background: linear-gradient(135deg, #623202 0%, #381a12 100%);
        }

        .game-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffcc00 0%, #ff3333 100%);
            border: 1px solid #ffcc00;
            font-size: 1.15rem;
            padding: 14px 36px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.4);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #ffcc00 0%, #ff3333 100%);
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.6);
        }

        .overlay-screen {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: rgba(18, 10, 5, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        .modal-card {
            background: linear-gradient(160deg, rgba(52, 28, 18, 0.92), rgba(26, 12, 8, 0.95));
            border: 1px solid rgba(255, 204, 0, 0.35);
            border-radius: 28px;
            padding: 36px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 204, 0, 0.15);
            animation: floatIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .game-title {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffcc00, #ffffff, #ff3333);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #d8c2a8;
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .difficulty-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 26px;
        }

        .diff-btn {
            flex: 1;
            padding: 10px 8px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #e2d1cbd5;
            font-family: 'Noto Sans Georgian', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .diff-btn.active {
            background: rgba(255, 204, 0, 0.2);
            border-color: #ffcc00;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .controls-hint {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.82rem;
            color: #bb9d88;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        #goal-banner {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 12;
            font-size: 2.6rem;
            font-weight: 800;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            text-shadow: 0 0 25px currentColor;
        }

        #goal-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        @media (max-width: 600px) {
            #hud-top {
                top: 12px;
                padding: 8px 18px;
                gap: 16px;
            }
            .score-value { font-size: 1.6rem; }
            .game-title { font-size: 1.9rem; }
            .modal-card { padding: 26px 20px; }
            .game-btn { padding: 9px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="hud-top">
        <div class="score-box">
            <span class="score-label player-label">მოთამაშე</span>
            <span id="player-score" class="score-value">0</span>
        </div>
        <div class="divider"></div>
        <div class="score-box">
            <span class="score-label ai-label">კომპიუტერი</span>
            <span id="ai-score" class="score-value">0</span>
        </div>
    </div>

    <div id="goal-banner">გოლი!</div>

    <div id="canvas-container"></div>

    <div id="controls-bar">
        <button id="btn-pause" class="game-btn" title="პაუზა">
            <span id="pause-icon">⏸</span> <span id="pause-text">პაუზა</span>
        </button>
        <button id="btn-restart" class="game-btn" title="თავიდან დაწყება">
            <span>🔄</span> <span>თავიდან</span>
        </button>
        <button id="btn-sound" class="game-btn" title="ხმის ჩართვა/გამორთვა">
            <span id="sound-icon">🔊</span> <span id="sound-text">ხმა</span>
        </button>
    </div>

    <div id="start-screen" class="overlay-screen">
        <div class="modal-card">
            <h1 class="game-title">3D პონგი</h1>
            <p class="subtitle">ნეონის არენა • პირველი 7 ქულამდე იგებს</p>
            
            <div style="margin-bottom: 10px; font-size: 0.85rem; color: #b89f94;">აირჩიეთ სირთულე:</div>
            <div class="difficulty-group" id="difficulty-selector">
                <button class="diff-btn" data-diff="easy">მარტივი</button>
                <button class="diff-btn active" data-diff="medium">საშუალო</button>
                <button class="diff-btn" data-diff="hard">რთული</button>
            </div>

            <button id="btn-start" class="game-btn btn-primary">თამაშის დაწყება</button>

            <div class="controls-hint">
                <span>🖱️ მართვა: მაუსით, თითით (Touch) ან ⬅️ ➡️ / A-D ღილაკებით</span>
                <span>🎯 დაარტყით ბურთს ჩოგნის კიდით კუთხის შესაცვლელად</span>
            </div>
        </div>
    </div>

    <div id="pause-screen" class="overlay-screen hidden">
        <div class="modal-card">
            <h2 class="game-title">პაუზა</h2>
            <p class="subtitle">თამაში დროებით შეჩერებულია</p>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button id="btn-resume" class="game-btn btn-primary">გაგრძელება</button>
                <button id="btn-pause-restart" class="game-btn">თავიდან დაწყება</button>
            </div>
        </div>
    </div>

    <div id="gameover-screen" class="overlay-screen hidden">
        <div class="modal-card">
            <h2 id="winner-title" class="game-title">გამარჯვება!</h2>
            <p id="final-score-text" class="subtitle">ანგარიში: 7 - 4</p>
            <button id="btn-play-again" class="game-btn btn-primary">კიდევ თამაში</button>
        </div>
    </div>
</div>

<script>
class SoundEngine {
    constructor() {
        this.ctx = null;
        this.muted = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                this.ctx = new AudioContext();
            }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    toggleMute() {
        this.muted = !this.muted;
        return this.muted;
    }

    playTone(freq, type, duration, volume = 0.2, slideTo = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;

        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }

            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {
        }
    }

    playPaddleHit(isPlayer) {
        this.playTone(isPlayer ? 520 : 420, 'triangle', 0.14, 0.25, isPlayer ? 780 : 600);
    }

    playWallHit() {
        this.playTone(260, 'sine', 0.09, 0.18, 180);
    }

    playScore(playerScored) {
        if (playerScored) {
            this.playTone(440, 'sine', 0.15, 0.25);
            setTimeout(() => this.playTone(660, 'sine', 0.25, 0.25), 110);
        } else {
            this.playTone(300, 'sawtooth', 0.2, 0.2, 140);
        }
    }

    playWin(didWin) {
        const notes = didWin ? [523.25, 659.25, 783.99, 1046.50] : [392.00, 349.23, 311.13, 261.63];
        notes.forEach((n, idx) => {
            setTimeout(() => this.playTone(n, 'triangle', 0.28, 0.25), idx * 130);
        });
    }
}

const CONFIG = {
    WIN_SCORE: 7,
    TABLE_WIDTH: 14,
    TABLE_LENGTH: 24,
    WALL_HEIGHT: 0.8,
    PADDLE_WIDTH: 3.0,
    PADDLE_HEIGHT: 0.65,
    PADDLE_DEPTH: 0.55,
    PADDLE_Z_OFFSET: 10.6,
    BALL_RADIUS: 0.42,
    BASE_BALL_SPEED: 15.5,
    MAX_BALL_SPEED: 32.0,
    SPEED_INCREMENT: 0.85,
    DIFFICULTIES: {
        easy:   { aiSpeed: 8.5,  aiReaction: 0.06, errorMargin: 0.9 },
        medium: { aiSpeed: 13.5, aiReaction: 0.11, errorMargin: 0.4 },
        hard:   { aiSpeed: 19.5, aiReaction: 0.18, errorMargin: 0.12 }
    }
};

class Pong3DGame {
    constructor() {
        this.sound = new SoundEngine();
        this.container = document.getElementById('canvas-container');

        this.state = 'MENU';
        this.difficulty = 'medium';
        this.playerScore = 0;
        this.aiScore = 0;
        this.goalTimer = 0;
        this.screenShake = 0;

        this.playerX = 0;
        this.targetPlayerX = 0;
        this.prevPlayerX = 0;
        this.playerVelocityX = 0;

        this.aiX = 0;
        this.aiTargetX = 0;

        this.ballPos = new THREE.Vector3(0, CONFIG.BALL_RADIUS, 0);
        this.ballVel = new THREE.Vector3(0, 0, 0);
        this.ballSpeed = CONFIG.BASE_BALL_SPEED;
        this.ballSpin = 0;

        this.keys = { left: false, right: false };
        this.raycaster = new THREE.Raycaster();
        this.pointer = new THREE.Vector2();
        this.dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        this.particles = [];

        this.initThree();
        this.buildArena();
        this.buildEntities();
        this.bindEvents();

        this.clock = new THREE.Clock();
        this.animate = this.animate.bind(this);
    }

    initThree() {
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x0d0905);
        this.scene.fog = new THREE.FogExp2(0x0d0905, 0.022);

        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;
        this.camera = new THREE.PerspectiveCamera(48, width / height, 0.1, 120);
        this.baseCamPos = new THREE.Vector3(0, 13.5, 20.5);
        this.camera.position.copy(this.baseCamPos);
        this.camera.lookAt(0, 0, -1.5);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x7a5a3a, 1.1);
        this.scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(8, 22, 12);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 2;
        dirLight.shadow.camera.far = 50;
        const d = 16;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        this.scene.add(dirLight);

        this.ballLight = new THREE.PointLight(0xffcc00, 1.8, 12);
        this.scene.add(this.ballLight);
    }

    buildArena() {
        const gridHelper = new THREE.GridHelper(80, 40, 0x472e16, 0x26140b);
        gridHelper.position.y = -0.6;
        this.scene.add(gridHelper);

        const tableGeo = new THREE.BoxGeometry(CONFIG.TABLE_WIDTH, 0.5, CONFIG.TABLE_LENGTH);
        const tableMat = new THREE.MeshStandardMaterial({
            color: 0x24140b,
            roughness: 0.25,
            metalness: 0.65
        });
        const table = new THREE.Mesh(tableGeo, tableMat);
        table.position.y = -0.25;
        table.receiveShadow = true;
        this.scene.add(table);

        const centerLineGeo = new THREE.PlaneGeometry(CONFIG.TABLE_WIDTH - 0.6, 0.14);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x6e481e, transparent: true, opacity: 0.65 });
        const centerLine = new THREE.Mesh(centerLineGeo, lineMat);
        centerLine.rotation.x = -Math.PI / 2;
        centerLine.position.y = 0.01;
        this.scene.add(centerLine);

        const ringGeo = new THREE.RingGeometry(2.2, 2.35, 48);
        const ringMesh = new THREE.Mesh(ringGeo, lineMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.y = 0.01;
        this.scene.add(ringMesh);

        const wallGeo = new THREE.BoxGeometry(0.35, CONFIG.WALL_HEIGHT, CONFIG.TABLE_LENGTH);
        const wallMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xcc8800,
            emissiveIntensity: 0.9,
            roughness: 0.2
        });

        const leftWall = new THREE.Mesh(wallGeo, wallMat);
        leftWall.position.set(-CONFIG.TABLE_WIDTH / 2 - 0.175, CONFIG.WALL_HEIGHT / 2 - 0.1, 0);
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        this.scene.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeo, wallMat);
        rightWall.position.set(CONFIG.TABLE_WIDTH / 2 + 0.175, CONFIG.WALL_HEIGHT / 2 - 0.1, 0);
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        this.scene.add(rightWall);

        const goalStripGeo = new THREE.BoxGeometry(CONFIG.TABLE_WIDTH, 0.06, 0.18);
        const playerGoalMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const aiGoalMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });

        const playerGoalLine = new THREE.Mesh(goalStripGeo, playerGoalMat);
        playerGoalLine.position.set(0, 0.01, CONFIG.TABLE_LENGTH / 2 - 0.1);
        this.scene.add(playerGoalLine);

        const aiGoalLine = new THREE.Mesh(goalStripGeo, aiGoalMat);
        aiGoalLine.position.set(0, 0.01, -CONFIG.TABLE_LENGTH / 2 + 0.1);
        this.scene.add(aiGoalLine);
    }

    buildEntities() {
        const paddleGeo = new THREE.BoxGeometry(CONFIG.PADDLE_WIDTH, CONFIG.PADDLE_HEIGHT, CONFIG.PADDLE_DEPTH);
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0xffcc00,
            emissive: 0xffaa00,
            emissiveIntensity: 0.75,
            roughness: 0.2,
            metalness: 0.3
        });
        this.playerPaddle = new THREE.Mesh(paddleGeo, playerMat);
        this.playerPaddle.position.set(0, CONFIG.PADDLE_HEIGHT / 2, CONFIG.PADDLE_Z_OFFSET);
        this.playerPaddle.castShadow = true;
        this.playerPaddle.receiveShadow = true;
        this.scene.add(this.playerPaddle);

        const aiMat = new THREE.MeshStandardMaterial({
            color: 0xff3333,
            emissive: 0xcc0000,
            emissiveIntensity: 0.75,
            roughness: 0.2,
            metalness: 0.3
        });
        this.aiPaddle = new THREE.Mesh(paddleGeo, aiMat);
        this.aiPaddle.position.set(0, CONFIG.PADDLE_HEIGHT / 2, -CONFIG.PADDLE_Z_OFFSET);
        this.aiPaddle.castShadow = true;
        this.aiPaddle.receiveShadow = true;
        this.scene.add(this.aiPaddle);

        const ballGeo = new THREE.SphereGeometry(CONFIG.BALL_RADIUS, 28, 28);
        const ballMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xfff080,
            emissiveIntensity: 0.9,
            roughness: 0.1
        });
        this.ballMesh = new THREE.Mesh(ballGeo, ballMat);
        this.ballMesh.castShadow = true;
        this.ballMesh.position.copy(this.ballPos);
        this.scene.add(this.ballMesh);

        const haloGeo = new THREE.RingGeometry(CONFIG.BALL_RADIUS * 1.1, CONFIG.BALL_RADIUS * 1.45, 24);
        const haloMat = new THREE.MeshBasicMaterial({
            color: 0xffcc00,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.55
        });
        this.ballHalo = new THREE.Mesh(haloGeo, haloMat);
        this.ballHalo.rotation.x = -Math.PI / 2;
        this.ballHalo.position.y = 0.03;
        this.scene.add(this.ballHalo);
    }

    spawnParticles(position, colorHex, count = 18) {
        const geo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
        const mat = new THREE.MeshBasicMaterial({ color: colorHex });

        for (let i = 0; i < count; i++) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 6;
            const vel = new THREE.Vector3(
                Math.cos(angle) * speed,
                1.5 + Math.random() * 4.5,
                Math.sin(angle) * speed
            );
            this.scene.add(mesh);
            this.particles.push({ mesh, vel, life: 1.0 });
        }
    }

    updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life -= dt * 2.4;
            if (p.life <= 0) {
                this.scene.remove(p.mesh);
                this.particles.splice(i, 1);
            } else {
                p.vel.y -= 12 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.mesh.rotation.x += 5 * dt;
                p.mesh.rotation.y += 5 * dt;
                p.mesh.scale.setScalar(Math.max(0.01, p.life));
            }
        }
    }

    resetBall(serveToPlayer = true) {
        this.ballPos.set(0, CONFIG.BALL_RADIUS, 0);
        this.ballSpeed = CONFIG.BASE_BALL_SPEED;
        this.ballSpin = 0;

        const angle = (Math.random() - 0.5) * 0.95;
        const dirZ = serveToPlayer ? 1 : -1;
        this.ballVel.set(
            Math.sin(angle) * this.ballSpeed,
            0,
            Math.cos(angle) * this.ballSpeed * dirZ
        );
        this.ballMesh.position.copy(this.ballPos);
    }

    startNewGame() {
        this.sound.init();
        this.playerScore = 0;
        this.aiScore = 0;
        this.updateScoreUI();

        this.playerX = 0;
        this.targetPlayerX = 0;
        this.aiX = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('gameover-screen').classList.add('hidden');

        this.state = 'PLAYING';
        this.resetBall(Math.random() > 0.5);
    }

    togglePause() {
        if (this.state === 'PLAYING') {
            this.state = 'PAUSED';
            document.getElementById('pause-screen').classList.remove('hidden');
            document.getElementById('pause-icon').textContent = '▶';
            document.getElementById('pause-text').textContent = 'გაგრძელება';
        } else if (this.state === 'PAUSED') {
            this.state = 'PLAYING';
            document.getElementById('pause-screen').classList.add('hidden');
            document.getElementById('pause-icon').textContent = '⏸';
            document.getElementById('pause-text').textContent = 'პაუზა';
            this.clock.getDelta();
        }
    }

    updateScoreUI() {
        document.getElementById('player-score').textContent = this.playerScore;
        document.getElementById('ai-score').textContent = this.aiScore;
    }

    showGoalBanner(text, color) {
        const banner = document.getElementById('goal-banner');
        banner.textContent = text;
        banner.style.color = color;
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 950);
    }

    handleGoal(playerScored) {
        this.sound.playScore(playerScored);
        this.screenShake = 0.45;

        if (playerScored) {
            this.playerScore++;
            this.spawnParticles(this.ballPos, 0xffcc00, 32);
            this.showGoalBanner('ქულა თქვენია!', '#ffcc00');
        } else {
            this.aiScore++;
            this.spawnParticles(this.ballPos, 0xff3333, 32);
            this.showGoalBanner('ქულა კომპიუტერს!', '#ff3333');
        }

        this.updateScoreUI();

        if (this.playerScore >= CONFIG.WIN_SCORE || this.aiScore >= CONFIG.WIN_SCORE) {
            this.state = 'GAMEOVER';
            const didWin = this.playerScore >= CONFIG.WIN_SCORE;
            this.sound.playWin(didWin);

            const titleEl = document.getElementById('winner-title');
            titleEl.textContent = didWin ? 'გილოცავთ, მოიგეთ! 🏆' : 'სამწუხაროდ, წააგეთ!';
            document.getElementById('final-score-text').textContent =
                `საბოლოო ანგარიში: ${this.playerScore} - ${this.aiScore}`;
            document.getElementById('gameover-screen').classList.remove('hidden');
            return;
        }

        this.state = 'GOAL_DELAY';
        this.goalTimer = 1.05;
        this.nextServeToPlayer = !playerScored;
        this.ballMesh.visible = false;
        this.ballHalo.visible = false;
    }

    updatePhysics(dt) {
        const maxPaddleX = (CONFIG.TABLE_WIDTH / 2) - (CONFIG.PADDLE_WIDTH / 2) - 0.1;

        const keySpeed = 19.0;
        if (this.keys.left) this.targetPlayerX -= keySpeed * dt;
        if (this.keys.right) this.targetPlayerX += keySpeed * dt;
        this.targetPlayerX = Math.max(-maxPaddleX, Math.min(maxPaddleX, this.targetPlayerX));

        this.prevPlayerX = this.playerX;
        this.playerX += (this.targetPlayerX - this.playerX) * Math.min(1, dt * 22);
        this.playerVelocityX = (this.playerX - this.prevPlayerX) / Math.max(dt, 0.001);
        this.playerPaddle.position.x = this.playerX;

        this.playerPaddle.rotation.z = -this.playerVelocityX * 0.012;

        const diffSettings = CONFIG.DIFFICULTIES[this.difficulty];
        if (this.ballVel.z < 0) {
            const timeToReach = Math.abs((-CONFIG.PADDLE_Z_OFFSET - this.ballPos.z) / this.ballVel.z);
            let predictedX = this.ballPos.x + this.ballVel.x * timeToReach;
            const halfW = CONFIG.TABLE_WIDTH / 2 - CONFIG.BALL_RADIUS;
            if (predictedX > halfW) predictedX = halfW - (predictedX - halfW);
            if (predictedX < -halfW) predictedX = -halfW - (predictedX + halfW);

            const wobble = Math.sin(performance.now() * 0.004) * diffSettings.errorMargin;
            this.aiTargetX = predictedX + wobble;
        } else {
            this.aiTargetX = 0;
        }

        this.aiTargetX = Math.max(-maxPaddleX, Math.min(maxPaddleX, this.aiTargetX));
        const aiDiff = this.aiTargetX - this.aiX;
        const aiStep = Math.sign(aiDiff) * Math.min(Math.abs(aiDiff), diffSettings.aiSpeed * dt);
        this.aiX += aiStep;
        this.aiPaddle.position.x = this.aiX;

        this.ballVel.x += this.ballSpin * dt * 6.5;
        this.ballPos.addScaledVector(this.ballVel, dt);

        const wallLimit = (CONFIG.TABLE_WIDTH / 2) - CONFIG.BALL_RADIUS;
        if (this.ballPos.x <= -wallLimit) {
            this.ballPos.x = -wallLimit;
            this.ballVel.x = Math.abs(this.ballVel.x);
            this.ballSpin *= -0.5;
            this.sound.playWallHit();
            this.spawnParticles(this.ballPos, 0xffcc00, 10);
        } else if (this.ballPos.x >= wallLimit) {
            this.ballPos.x = wallLimit;
            this.ballVel.x = -Math.abs(this.ballVel.x);
            this.ballSpin *= -0.5;
            this.sound.playWallHit();
            this.spawnParticles(this.ballPos, 0xffcc00, 10);
        }

        const hitHalfWidth = (CONFIG.PADDLE_WIDTH / 2) + CONFIG.BALL_RADIUS * 0.85;
        const paddleFrontZ = CONFIG.PADDLE_Z_OFFSET - (CONFIG.PADDLE_DEPTH / 2) - CONFIG.BALL_RADIUS;

        if (
            this.ballVel.z > 0 &&
            this.ballPos.z >= paddleFrontZ &&
            this.ballPos.z <= CONFIG.PADDLE_Z_OFFSET + CONFIG.PADDLE_DEPTH
        ) {
            if (Math.abs(this.ballPos.x - this.playerX) <= hitHalfWidth) {
                this.ballPos.z = paddleFrontZ;
                this.reflectBallFromPaddle(this.playerX, this.playerVelocityX, true);
            }
        }

        const aiFrontZ = -CONFIG.PADDLE_Z_OFFSET + (CONFIG.PADDLE_DEPTH / 2) + CONFIG.BALL_RADIUS;
        if (
            this.ballVel.z < 0 &&
            this.ballPos.z <= aiFrontZ &&
            this.ballPos.z >= -CONFIG.PADDLE_Z_OFFSET - CONFIG.PADDLE_DEPTH
        ) {
            if (Math.abs(this.ballPos.x - this.aiX) <= hitHalfWidth) {
                this.ballPos.z = aiFrontZ;
                this.reflectBallFromPaddle(this.aiX, 0, false);
            }
        }

        const goalLimitZ = (CONFIG.TABLE_LENGTH / 2) + CONFIG.BALL_RADIUS;
        if (this.ballPos.z > goalLimitZ) {
            this.handleGoal(false);
        } else if (this.ballPos.z < -goalLimitZ) {
            this.handleGoal(true);
        }

        this.ballMesh.position.copy(this.ballPos);
        this.ballHalo.position.set(this.ballPos.x, 0.03, this.ballPos.z);
        this.ballLight.position.set(this.ballPos.x, 1.8, this.ballPos.z);
    }

    reflectBallFromPaddle(paddleX, paddleVelX, isPlayer) {
        this.ballSpeed = Math.min(CONFIG.MAX_BALL_SPEED, this.ballSpeed + CONFIG.SPEED_INCREMENT);

        const relativeIntersectX = (this.ballPos.x - paddleX) / (CONFIG.PADDLE_WIDTH / 2);
        const clampedOffset = Math.max(-1.1, Math.min(1.1, relativeIntersectX));

        const bounceAngle = clampedOffset * (Math.PI / 3.4);
        const dirZ = isPlayer ? -1 : 1;

        this.ballVel.x = Math.sin(bounceAngle) * this.ballSpeed;
        this.ballVel.z = Math.cos(bounceAngle) * this.ballSpeed * dirZ;

        this.ballSpin = Math.max(-1.8, Math.min(1.8, paddleVelX * 0.06));

        this.sound.playPaddleHit(isPlayer);
        const color = isPlayer ? 0xffcc00 : 0xff3333;
        this.ballLight.color.setHex(color);
        this.ballHalo.material.color.setHex(color);
        this.spawnParticles(this.ballPos, color, 20);
        this.screenShake = 0.16;

        const paddle = isPlayer ? this.playerPaddle : this.aiPaddle;
        paddle.scale.set(1.08, 1.15, 0.85);
    }

    updateVisualPolish(dt) {
        this.playerPaddle.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 15));
        this.aiPaddle.scale.lerp(new THREE.Vector3(1, 1, 1), Math.min(1, dt * 15));

        const targetCamX = this.playerX * 0.22;
        this.camera.position.x += (targetCamX - this.camera.position.x) * Math.min(1, dt * 6);
        this.camera.position.y = this.baseCamPos.y;
        this.camera.position.z = this.baseCamPos.z;

        if (this.screenShake > 0) {
            this.camera.position.x += (Math.random() - 0.5) * this.screenShake;
            this.camera.position.y += (Math.random() - 0.5) * this.screenShake;
            this.screenShake = Math.max(0, this.screenShake - dt * 2.2);
        }
        this.camera.lookAt(this.playerX * 0.1, 0, -1.5);
    }

    animate() {
        requestAnimationFrame(this.animate);

        const dt = Math.min(this.clock.getDelta(), 0.05);

        if (this.state === 'PLAYING') {
            this.updatePhysics(dt);
        } else if (this.state === 'GOAL_DELAY') {
            this.goalTimer -= dt;
            if (this.goalTimer <= 0) {
                this.ballMesh.visible = true;
                this.ballHalo.visible = true;
                this.resetBall(this.nextServeToPlayer);
                this.state = 'PLAYING';
            }
        } else if (this.state === 'MENU') {
            const t = performance.now() * 0.0005;
            this.camera.position.x = Math.sin(t) * 3.5;
            this.camera.lookAt(0, 0, -1.5);
        }

        this.updateParticles(dt);
        if (this.state !== 'MENU') {
            this.updateVisualPolish(dt);
        }

        this.renderer.render(this.scene, this.camera);
    }

    updatePointerTarget(clientX, clientY) {
        const rect = this.renderer.domElement.getBoundingClientRect();
        this.pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        this.pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        this.raycaster.setFromCamera(this.pointer, this.camera);
        const intersectPoint = new THREE.Vector3();
        if (this.raycaster.ray.intersectPlane(this.dragPlane, intersectPoint)) {
            this.targetPlayerX = intersectPoint.x;
        }
    }

    bindEvents() {
        window.addEventListener('mousemove', (e) => {
            if (this.state === 'PLAYING' || this.state === 'GOAL_DELAY') {
                this.updatePointerTarget(e.clientX, e.clientY);
            }
        });

        const handleTouch = (e) => {
            if (e.touches && e.touches.length > 0) {
                if (this.state === 'PLAYING' || this.state === 'GOAL_DELAY') {
                    this.updatePointerTarget(e.touches[0].clientX, e.touches[0].clientY);
                }
            }
        };
        this.container.addEventListener('touchstart', handleTouch, { passive: true });
        this.container.addEventListener('touchmove', handleTouch, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ა') {
                this.keys.left = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'დ') {
                this.keys.right = true;
            }
            if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
                if (this.state === 'PLAYING' || this.state === 'PAUSED') {
                    this.togglePause();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ა') {
                this.keys.left = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'დ') {
                this.keys.right = false;
            }
        });

        window.addEventListener('resize', () => {
            const width = this.container.clientWidth || window.innerWidth;
            const height = this.container.clientHeight || window.innerHeight;
            this.camera.aspect = width / height;
            if (this.camera.aspect < 0.85) {
                this.baseCamPos.set(0, 17.5, 25.5);
            } else {
                this.baseCamPos.set(0, 13.5, 20.5);
            }
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(width, height);
        });
        window.dispatchEvent(new Event('resize'));

        document.getElementById('btn-start').addEventListener('click', () => this.startNewGame());
        document.getElementById('btn-play-again').addEventListener('click', () => this.startNewGame());
        document.getElementById('btn-resume').addEventListener('click', () => this.togglePause());
        document.getElementById('btn-pause').addEventListener('click', () => this.togglePause());

        document.getElementById('btn-restart').addEventListener('click', () => this.startNewGame());
        document.getElementById('btn-pause-restart').addEventListener('click', () => this.startNewGame());

        document.getElementById('btn-sound').addEventListener('click', () => {
            const isMuted = this.sound.toggleMute();
            document.getElementById('sound-icon').textContent = isMuted ? '🔇' : '🔊';
        });

        const diffButtons = document.querySelectorAll('.diff-btn');
        diffButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                diffButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.difficulty = btn.getAttribute('data-diff');
            });
        });
    }
}

window.onload = function () {
    const game = new Pong3DGame();
    game.animate();
};
</script>
